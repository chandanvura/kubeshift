sonar.projectKey=chandanvura_kubeshift
sonar.organization=chandanvura
sonar.host.url=https://sonarcloud.io

# Project information
sonar.projectName=KubeShift
sonar.projectVersion=1.0.0

# Source modules
sonar.modules=kubeshift-core,kubeshift-remediate

# Module-specific source paths
kubeshift-core.sonar.projectBaseDir=kubeshift-core
kubeshift-core.sonar.sources=src/main/java
kubeshift-core.sonar.tests=src/test/java
kubeshift-core.sonar.java.binaries=target/classes
kubeshift-core.sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

kubeshift-remediate.sonar.projectBaseDir=kubeshift-remediate
kubeshift-remediate.sonar.sources=src/main/java
kubeshift-remediate.sonar.tests=src/test/java
kubeshift-remediate.sonar.java.binaries=target/classes
kubeshift-remediate.sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

# Exclusions
sonar.exclusions=**/target/**,**/*.xml,**/static/**,**/resources/**
sonar.coverage.exclusions=**/*Application.java,**/*Config.java,**/model/**,**/exception/**
