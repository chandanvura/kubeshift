global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "/etc/prometheus/rules/kubeshift-alerts.yml"

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'kubeshift-core'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['kubeshift-core:8080']

  - job_name: 'kubeshift-remediate'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['kubeshift-remediate:8081']

  - job_name: 'kubeshift-analyzer'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['kubeshift-analyzer:8082']
