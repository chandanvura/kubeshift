apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kubeshift
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/your-org/kubeshift.git'
    path: deploy/helm/kubeshift
    targetRevision: main
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: kubeshift
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
