server:
  port: 8080

spring:
  application:
    name: kubeshift-core
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

kubeshift:
  security:
    api-key: ${API_KEY:default-dev-key}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  cost:
    cpu-rate-per-core-hour: 0.048
    memory-rate-per-gb-hour: 0.006
    headroom-buffer-percent: 20
  metrics:
    collection-interval-seconds: 60
  cluster:
    mode: local

server:
  port: 8080
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
  prometheus:
    metrics:
      export:
        enabled: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
