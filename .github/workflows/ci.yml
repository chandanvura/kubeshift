name: CI Workflow

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Build with Maven
        run: cd kubeshift-core && mvn clean verify
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-results
          path: kubeshift-core/target/surefire-reports/

  build-remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Build with Maven
        run: cd kubeshift-remediate && mvn clean verify
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remediate-test-results
          path: kubeshift-remediate/target/surefire-reports/

  build-analyzer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: |
          cd kubeshift-analyzer
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest flake8
      - name: Lint with flake8
        run: |
          cd kubeshift-analyzer
          flake8 .
      - name: Test with pytest
        run: |
          cd kubeshift-analyzer
          pytest

  docker-build:
    needs: [build-core, build-remediate, build-analyzer]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build and push Core
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./kubeshift-core/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/kubeshift-core:${{ github.sha }},ghcr.io/${{ github.repository }}/kubeshift-core:latest
          
      - name: Build and push Remediate
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./kubeshift-remediate/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/kubeshift-remediate:${{ github.sha }},ghcr.io/${{ github.repository }}/kubeshift-remediate:latest
          
      - name: Build and push Analyzer
        uses: docker/build-push-action@v5
        with:
          context: ./kubeshift-analyzer
          push: true
          tags: ghcr.io/${{ github.repository }}/kubeshift-analyzer:${{ github.sha }},ghcr.io/${{ github.repository }}/kubeshift-analyzer:latest
