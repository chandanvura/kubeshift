name: CD Workflow (GitOps)

on:
  workflow_run:
    workflows: ["CI Workflow"]
    types:
      - completed
    branches:
      - main

jobs:
  update-manifests:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Update Helm values
        run: |
          sed -i "s/tag: .*/tag: ${{ github.event.workflow_run.head_sha }}/g" deploy/helm/kubeshift/values.yaml

      - name: Commit and push changes
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
          git add deploy/helm/kubeshift/values.yaml
          git diff --staged --quiet || git commit -m "chore: update image tags to ${{ github.event.workflow_run.head_sha }} [skip ci]"
          git push
