name: CD Workflow (GitOps)

on:
  workflow_run:
    workflows: ["CI Workflow"]
    types:
      - completed
    branches:
      - main

jobs:
  update-manifests:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Update Helm values
        run: |
          sed -i "s/tag: .*/tag: ${{ github.sha }}/g" deploy/helm/kubeshift/values.yaml
          
      - name: Commit and push changes
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
          git add deploy/helm/kubeshift/values.yaml
          git commit -m "chore: update image tags to ${{ github.sha }} [skip ci]"
          git push
          
      - name: Comment on commit
        uses: peter-evans/commit-comment@v3
        with:
          sha: ${{ github.sha }}
          body: |
            Deployment initiated via GitOps!
            ArgoCD will pick up the changes shortly.
            Image tags updated to `${{ github.sha }}`.
