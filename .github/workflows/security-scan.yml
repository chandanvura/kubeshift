name: Security Scan

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * 0' # Weekly on Sundays

jobs:
  trivy-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Build docker images
        run: |
          docker build -t kubeshift-core:${{ github.sha }} ./kubeshift-core
          docker build -t kubeshift-remediate:${{ github.sha }} ./kubeshift-remediate
          docker build -t kubeshift-analyzer:${{ github.sha }} ./kubeshift-analyzer
          
      - name: Run Trivy vulnerability scanner on Core
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'kubeshift-core:${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-core.sarif'
          severity: 'CRITICAL'
          exit-code: '1'
          
      - name: Run Trivy vulnerability scanner on Remediate
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'kubeshift-remediate:${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-remediate.sarif'
          severity: 'CRITICAL'
          exit-code: '1'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-core.sarif'

  sonarqube-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Cache SonarCloud packages
        uses: actions/cache@v3
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      - name: Build and analyze Core
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: cd kubeshift-core && mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=kubeshift-core
