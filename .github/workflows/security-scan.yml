name: Security Scan

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * 0' # Weekly on Sundays

jobs:
  trivy-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      # Build with correct root context so Dockerfiles can find all module pom files
      - name: Build docker images
        run: |
          docker build -t kubeshift-core:${{ github.sha }} -f ./kubeshift-core/Dockerfile .
          docker build -t kubeshift-remediate:${{ github.sha }} -f ./kubeshift-remediate/Dockerfile .
          docker build -t kubeshift-analyzer:${{ github.sha }} ./kubeshift-analyzer

      - name: Run Trivy vulnerability scanner on Core
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'kubeshift-core:${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-core.sarif'
          severity: 'CRITICAL'
          exit-code: '0'

      - name: Run Trivy vulnerability scanner on Remediate
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'kubeshift-remediate:${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-remediate.sarif'
          severity: 'CRITICAL'
          exit-code: '0'

      - name: Upload Core scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: 'trivy-core.sarif'

      - name: Upload Remediate scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: 'trivy-remediate.sarif'

  sonarqube-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for better analysis

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Build and analyze Core
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -pl kubeshift-core -am -B verify \
            org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=${{ github.repository_owner }}_kubeshift-core \
            -Dsonar.organization=${{ github.repository_owner }} \
            -Dsonar.host.url=https://sonarcloud.io

      - name: Build and analyze Remediate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -pl kubeshift-remediate -am -B verify \
            org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=${{ github.repository_owner }}_kubeshift-remediate \
            -Dsonar.organization=${{ github.repository_owner }} \
            -Dsonar.host.url=https://sonarcloud.io
