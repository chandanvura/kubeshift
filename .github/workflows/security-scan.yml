name: Security Scan

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * 0' # Weekly on Sundays

jobs:
  trivy-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      # Build with correct root context so Dockerfiles can find all module pom files
      - name: Build docker images
        run: |
          docker build -t kubeshift-core:${{ github.sha }} -f ./kubeshift-core/Dockerfile .
          docker build -t kubeshift-remediate:${{ github.sha }} -f ./kubeshift-remediate/Dockerfile .
          docker build -t kubeshift-analyzer:${{ github.sha }} ./kubeshift-analyzer

      - name: Run Trivy vulnerability scanner on Core
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'kubeshift-core:${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-core.sarif'
          severity: 'CRITICAL'
          exit-code: '0'

      - name: Run Trivy vulnerability scanner on Remediate
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'kubeshift-remediate:${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-remediate.sarif'
          severity: 'CRITICAL'
          exit-code: '0'

      - name: Upload Core scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: 'trivy-core.sarif'

      - name: Upload Remediate scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: 'trivy-remediate.sarif'

  sonarqube-scan:
    runs-on: ubuntu-latest
    # This job only runs when SONAR_TOKEN is configured as a repository secret.
    # To enable: add SONAR_TOKEN secret in GitHub → Settings → Secrets → Actions
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones disabled for better SonarCloud analysis

      - name: Check if SONAR_TOKEN is available
        id: sonar-check
        run: |
          if [ -z "${{ secrets.SONAR_TOKEN }}" ]; then
            echo "SONAR_TOKEN is not set. Skipping SonarCloud analysis."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "SONAR_TOKEN found. Proceeding with analysis."
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up JDK 21
        if: steps.sonar-check.outputs.skip == 'false'
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache SonarCloud packages
        if: steps.sonar-check.outputs.skip == 'false'
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache Maven packages
        if: steps.sonar-check.outputs.skip == 'false'
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Build and analyze with SonarCloud
        if: steps.sonar-check.outputs.skip == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -B verify \
            org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=chandanvura_kubeshift \
            -Dsonar.organization=chandanvura \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.coverage.jacoco.xmlReportPaths=kubeshift-core/target/site/jacoco/jacoco.xml,kubeshift-remediate/target/site/jacoco/jacoco.xml \
            -DskipTests

